<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../jquery-4.0.0.min.js"></script>
    <script>
        $(()=>{
            $("p").css("color","blue").css("border", "2px solid red");
            $("#p1").css("background-color", "yellow");
            $("p:first").css("border", "2px solid green");
            $("p:last").css("border", "2px solid green");

            // table
            $("table tr:even").hide();
        })

    </script>
</head>
<body>
    <p id="p1">Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>


    <table border="1">
    <tr><td>Row 1</td></tr>
    <tr><td>Row 2</td></tr>
    <tr><td>Row 3</td></tr>
    <tr><td>Row 4</td></tr>
</table>
</body>
</html>
