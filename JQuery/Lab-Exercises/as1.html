<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Todo List</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 50px auto;
        text-align: center;
    }
    input[type="text"] {
        padding: 8px;
        width: 70%;
        margin-right: 5px;
    }
    button {
        padding: 8px 12px;
        cursor: pointer;
    }
    ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
    }
    li {
        padding: 10px;
        background: #f0f0f0;
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 5px;
    }
    li button {
        background: red;
        color: white;
        border: none;
        border-radius: 3px;
    }
</style>
    <script src="../jquery-4.0.0.min.js"></script>
    <script>
    $(document).ready(function() {

      
        $("#addTaskBtn").click(function() {
            const task = $("#taskInput").val().trim();
            if(task) {
                const li = `<li>${task} <button class="deleteBtn">Delete</button></li>`;
                $("#taskList").append(li);
                $("#taskInput").val(""); // clear input
            } else {
                alert("Please enter a task!");
            }
        });

      
        $("#taskList").on("click", ".deleteBtn", function() {
            $(this).parent().remove();
        });


        $("#clearAllBtn").click(function() {
            $("#taskList").empty();
        });

        $("#taskInput").keypress(function(e) {
            if(e.which === 13) {
                $("#addTaskBtn").click();
            }
        });

    });
    </script>
</head>
<body>
    <h1>Dynamic Todo List</h1>
    <input type="text" id="taskInput" placeholder="Enter a new task">
    <button id="addTaskBtn">Add Task</button>
    <button id="clearAllBtn">Clear All</button>
    <ul id="taskList"></ul>
</body>
</html>
