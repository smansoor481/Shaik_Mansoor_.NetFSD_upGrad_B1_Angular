<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Card with Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 50px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .card {
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fff;
        }

        .img {
            width: 100%;
            border-radius: 5px;
        }

        .title {
            font-size: 18px;
            margin: 10px 0;
        }

        .price {
            color: #1e88e5;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 20px;
            background: #1e88e5;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #1565c0;
        }

        /* Login form inside card */
        .login-form {
            margin-top: 20px;
            text-align: left;
        }

        .login-form input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-form button {
            width: 100%;
            padding: 8px;
            background: #1e88e5;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-form button:hover {
            background: #1565c0;
        }

        .login-form h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="image.png" alt="Laptop" class="img">
        <h2 class="title">Laptop Pro 15</h2>
        <p class="price">80,000</p>
        <p class="desc">15-inch laptop with Intel i7, 16GB RAM, 512GB SSD.</p>
        <button class="btn">Buy Now</button>

        <hr>
        <div class="login-form">
            <h3>Login</h3>
            <form>
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
