<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & Font Properties </title>
    <style>
        #title
        {
            font-size: 32px;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px hotpink;

        }
        p
        {
            font-style: italic;
        }
        .para
        {
            line-height: 1.6; /*It gives the line*/
        }

        
    </style>
</head>
<body>
    
        <h1 id="title">This is a title</h1>
        <p>This is a sub title.</p>

        <div class="para">
            <p>This is a paragraph</p>
        </div>
  

  
</body>
</html>
