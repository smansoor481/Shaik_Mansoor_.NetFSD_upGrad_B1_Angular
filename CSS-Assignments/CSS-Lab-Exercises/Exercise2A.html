<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Selectors</title>
    <style>
        /* Element Selector */
        p
        {
            color: blue;
        }
        /* class selector */
        .para1
        {
            background-color: yellow;
        }

        /* group selector */
        h1, button
        {
            font-family: Verdana;
        }

        /* id selector */
        #box
        {
            width: 300px;
            border: 2px solid red;
            padding: 30px;
            box-sizing: border-box;
        }

        /* Universal selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
      

    </style>
</head>
<body>
    <h1>CSS selector</h1>
    <p class="para1">This is paragraph1.</p>
    <p>This is paragraph2.</p>
    <p>This is paragraph3.</p>
    <div id = box>
        This is a div tag1.
    </div>
    <div>
        This is a div tag2.
    </div>

    <button>Button1</button>
    <button>Button2</button>
</body>
</html>
