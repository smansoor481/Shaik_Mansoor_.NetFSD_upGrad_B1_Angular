<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background & Border Properties</title>

    <style>
        #card1
        {
            border: 2px solid green;
            width: 200px;
            height: 100px;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            background-color: aqua;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="card1">
        This is card-1
    </div>
    <div id="card2">
        This is Card-2
    </div>
    <div id="card3">
        This is card-3
    </div>
</body>
</html>
