<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Media Controls </title>
</head>
<body>
    <h2 align="center">Welcome to Our Media Portal</h2>
    <hr>
    <h3>Audio Page</h3>
    <audio controls autoplay loop>
    <source src="song1.mp3">
    <source src="song2.mp3">
    <source src="song3.mp3">
        Your browser does not support the audio element.
    </audio>

    <hr>
    <h3>Video Page</h3>

    <video controls autoplay style="width: 500px; height: 300px; " poster="poster-image.jpg">
        <source src="dance1.mp4" >
        <source src="dance2.mp4">
        Your browser does not support the video element.
    </video>

</body>
</html>
