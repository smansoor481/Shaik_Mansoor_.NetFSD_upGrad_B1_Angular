<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Based Web Layout</title>
</head>
<body>

    <table width="100%" border="1" cellpadding="10" cellspacing="0">

        <!-- Header -->
        <tr bgcolor="lightblue">
            <td colspan="2" align="center">
                <font size="6"><b>My Website Header</b></font>
            </td>
        </tr>

        <!-- Navigation -->
        <tr bgcolor="lightgray">
            <td colspan="2" align="center">
                <font size="4">
                    Home | About | Services | Contact
                </font>
            </td>
        </tr>

        <!-- Content Area -->
        <tr>
            <td width="25%" bgcolor="lightyellow" valign="top">
                <font size="4"><b>Sidebar</b></font><br>
                Links<br>
                Menu<br>
                Categories
            </td>

            <td width="75%" bgcolor="white" valign="top">
                <font size="4"><b>Main Content</b></font><br>
                This is the main content area of the webpage layout using tables.
            </td>
        </tr>

        <!-- Footer -->
        <tr bgcolor="lightgreen">
            <td colspan="2" align="center">
                <font size="3">© 2026 My Website | All Rights Reserved</font>
            </td>
        </tr>

    </table>

</body>
</html>
