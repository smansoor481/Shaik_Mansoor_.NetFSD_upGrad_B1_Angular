<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Galary</title>
</head>
<body>
    <h3>Images1:</h3>
    <img src="image1.png" alt="Image1 is not found" height="200" width="200">
    <p>Caption: Nature view</p>

    <h3>Images2:</h3>
    <img src="technology.png" alt="image2 is not found" height="300" width="250">
    <p>Caption: Technology image</p>

    <h3>Images3:</h3>
    <img src="animal.png" alt="image3 is not found" height="150" width="100">
    <p>Caption: Animal image</p>

    <h3>One image wrapped inside a link:</h3>
    <a href="https://www.google.com/" target="_blank">
        <img src="animal.png" alt="Animal image" height="200" width="250">
    </a>
    <p>Caption: Animal image (Click to open Google)</p>


</body>
</html>
