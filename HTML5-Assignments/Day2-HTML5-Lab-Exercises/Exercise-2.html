<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <form action="">
       <fieldset style="width: 500px;">
        <legend>User Registration</legend>
        <table>
            <tr>
                <td>Email:</td>
                <td><input type="email" name="" id=""  required></td>
            </tr>

            <tr>
                <td>Url:</td>
                <td><input type="url" name="" id=""></td>
            </tr>

            <tr>
                <td>Number</td>
                <td><input type="number" name="" id="" min="18" max="60"></td>
            </tr>

            <tr>
                <td>Range</td>
                <td><input type="range" name="" id="" min="1" max="10"></td>
            </tr>

            <tr>
                <td>Date</td>
                <td><input type="date" name="" id=""></td>
            </tr>

            <tr>
                <td>Date time-Local</td>
                <td><input type="datetime-local" name="" id=""></td>
            </tr>

            <tr>
                <td>Color</td>
                <td><input type="color" name="" id=""></td>
            </tr>

            <tr>
                <td>Search</td>
                <td><input type="search" name="" id=""></td>
            </tr>

            <tr>
                <td>Telephone</td>
                <td><input type="tel" name="" id=""></td>
            </tr>

            <tr>
                <td>Month</td>
                <td><input type="month" name="" id=""></td>
            </tr>

            <tr>
                <td>Week</td>
                <td><input type="week" name="" id=""></td>
            </tr>

            <tr>
                <td>Time</td>
                <td><input type="time" name="" id=""></td>
            </tr>
        </table>
       </fieldset>
    </form>
</body>
</html>
