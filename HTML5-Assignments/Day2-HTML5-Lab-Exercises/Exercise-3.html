<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement New HTML5 Attributes</title>
</head>
<body>
    <form action="" novalidate>
        <fieldset style="width: 500px;">
            <legend>Registration</legend>
            <table>
                <tr>
                    <td>Your Data</td>
                    <td><input type="text" name="" id="" value="Your Details" readonly></td>
                </tr>
                <tr>
                    <td>Name</td>
                    <td><input type="text" placeholder="Enter your Name" required autofocus autocomplete="on"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="email" placeholder="Enter your Email" required autofocus autocomplete="on"></td>
                </tr>
                <tr>
                    <td>Phone</td>
                    <td><input type="tel" pattern="[5-9]{1}[0-9]{9}"></td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td><input type="number" min="18" max="60" step="1"></td>
                </tr>

                <tr>
                    <td>Upload your file</td>
                    <td><input type="file" name="" id="" multiple></td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" name="" id="">
                        <input type="reset" name="" id="" disabled>
                    </td>
                </tr>

            </table>
        </fieldset>
    </form>
</body>
</html>
